<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap');
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    a { color: #0068A7; } a:hover { color: #004E7D; }
    .m  { font-family: 'Source Serif 4', Georgia, serif; font-style: italic; }
    .mu { font-style: normal; }
    .frac { display: inline-flex; flex-direction: column; vertical-align: -0.48em; text-align: center; line-height: 1.18; }
    .frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 0.28em 0.05em; }
    .frac > span:last-child  { padding: 0.05em 0.28em 0; }
    .lim { display: inline-flex; flex-direction: column; align-items: center; vertical-align: -0.42em; line-height: 1.04; font-style: normal; }
    .lim > span:last-child { font-size: 0.56em; }
  </style>
</helmet>

<div style="width: 1920px; height: 1080px; background: #FBFAF7; color: #1A1D23; box-sizing: border-box; padding: 74px 96px; display: flex; flex-direction: column; gap: 0;">

  <!-- title band -->
  <div style="display: flex; align-items: flex-start; justify-content: space-between; padding-bottom: 26px; border-bottom: 1px solid #E5E7EB;">
    <div style="display: flex; flex-direction: column; gap: 13px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span style="background: #0068A7; color: #FFFFFF; font-size: 19px; font-weight: 700; letter-spacing: 0.09em; padding: 6px 15px; border-radius: 4px;">PROPOSITION</span>
        <span style="color: #0068A7; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;">3.1</span>
      </div>
      <div style="font-size: 60px; font-weight: 700; letter-spacing: -0.018em; line-height: 1.05;">Sine and Cosine Are Continuous</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px; padding-top: 6px;">
      <span style="font-size: 20px; color: #9AA0AC; font-variant-numeric: tabular-nums; letter-spacing: 0.03em;">STEP 1 OF 2</span>
      <span style="font-size: 17px; color: #C3C7CE;">§3.1</span>
    </div>
  </div>

  <!-- body: proof left, geometry right -->
  <div style="flex-grow: 1; display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr); gap: 66px; padding-top: 34px;">

    <!-- left column -->
    <div style="display: flex; flex-direction: column; gap: 24px;">
      <div style="border-left: 3px solid #0068A7; padding-left: 24px; display: flex; flex-direction: column; gap: 12px;">
        <span style="align-self: flex-start; border: 1.5px solid #0068A7; color: #0068A7; font-size: 15px; font-weight: 700; letter-spacing: 0.11em; padding: 4px 12px; border-radius: 4px;">PROOF</span>
        <div class="m mu" style="font-family: 'Source Serif 4', Georgia, serif; font-size: 27px; color: #565A63; line-height: 1.5;">
          Everything rests on one bound near <span class="m">θ</span> = 0.
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 26px; padding-left: 27px;">
        <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 42px; color: #1A1D23; letter-spacing: 0.005em;">
          0 &nbsp;&le;&nbsp; |<span class="mu">sin</span>&thinsp;<span class="m">θ</span>| &nbsp;&le;&nbsp; |<span class="m">θ</span>|
          <span style="font-family: Inter, sans-serif; font-size: 21px; color: #82868F; margin-left: 22px; letter-spacing: 0.01em;">chord &le; arc</span>
        </div>

        <div style="display: flex; align-items: center; gap: 20px; font-family: 'Source Serif 4', Georgia, serif; font-size: 42px; color: #1A1D23;">
          <span>|<span class="m">θ</span>| &rarr; 0</span>
          <svg width="46" height="20" viewBox="0 0 46 20" fill="none" style="flex-shrink: 0;">
            <path d="M1 10 H40 M33 4 L41 10 L33 16" stroke="#0068A7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span style="font-family: Inter, sans-serif; font-size: 21px; color: #82868F; letter-spacing: 0.01em;">squeeze</span>
        </div>
      </div>

      <!-- the conclusion: heaviest element on the frame -->
      <div style="margin-top: auto; background: #FFFFFF; border: 1px solid #E5E7EB; border-top: 3px solid #04773B; border-radius: 0 0 5px 5px; padding: 30px 36px 34px; display: flex; align-items: baseline; justify-content: space-between;">
        <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 62px; color: #04773B; letter-spacing: 0.004em;">
          <span class="lim"><span class="mu">lim</span><span class="m">θ&rarr;0</span></span>&thinsp;<span class="mu">sin</span>&thinsp;<span class="m">θ</span> = 0
        </div>
        <div style="font-size: 15px; font-weight: 600; letter-spacing: 0.11em; color: #04773B;">THE SEED</div>
      </div>
    </div>

    <!-- right column: the geometry that the narration names -->
    <div style="display: flex; flex-direction: column; gap: 18px;">
      <div style="font-size: 16px; font-weight: 600; letter-spacing: 0.11em; color: #9AA0AC;">WHERE THE BOUND COMES FROM</div>
      <div style="flex-grow: 1; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 5px; padding: 26px 30px; display: flex; flex-direction: column; gap: 14px;">
        <svg viewBox="0 0 560 330" style="width: 100%; height: auto;">
          <circle cx="120" cy="250" r="200" fill="none" stroke="#DDDCD6" stroke-width="1.6"/>
          <path d="M120 250 L320 250" stroke="#B9BDC4" stroke-width="1.6"/>
          <path d="M120 250 L273.2 121.4" stroke="#B9BDC4" stroke-width="1.6"/>
          <path d="M320 250 A200 200 0 0 0 273.2 121.4" fill="none" stroke="#0068A7" stroke-width="5" stroke-linecap="round"/>
          <path d="M273.2 121.4 L273.2 250" stroke="#994A00" stroke-width="5" stroke-linecap="round"/>
          <path d="M152 250 A32 32 0 0 0 144.5 229.5" fill="none" stroke="#9AA0AC" stroke-width="1.5"/>
          <text x="160" y="242" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="21" fill="#565A63">θ</text>
          <circle cx="273.2" cy="121.4" r="5" fill="#1A1D23"/>
          <circle cx="320" cy="250" r="5" fill="#1A1D23"/>
          <text x="286" y="112" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="21" fill="#1A1D23">B</text>
          <text x="330" y="272" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="21" fill="#1A1D23">A</text>
          <text x="288" y="196" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="22" fill="#994A00">sin θ</text>
          <text x="352" y="168" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="22" fill="#0068A7">θ</text>

          <path d="M420 62 L420 292" stroke="#EDECE8" stroke-width="1.4"/>
          <text x="440" y="52" font-family="Inter, sans-serif" font-size="15" letter-spacing="0.08em" fill="#9AA0AC">STRAIGHTENED</text>
          <rect x="440" y="96" width="128.6" height="15" rx="7.5" fill="#994A00"/>
          <text x="440" y="84" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="19" fill="#994A00">sin θ</text>
          <rect x="440" y="166" width="139.6" height="15" rx="7.5" fill="#0068A7"/>
          <text x="440" y="154" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="19" fill="#0068A7">θ</text>
          <path d="M440 218 H580" stroke="#DDDCD6" stroke-width="1.2" stroke-dasharray="4 4"/>
          <text x="440" y="248" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="24" fill="#1A1D23">sin θ &#8804; θ</text>
        </svg>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
