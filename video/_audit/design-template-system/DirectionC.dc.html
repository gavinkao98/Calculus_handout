<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap');
    body { margin: 0; font-family: Archivo, system-ui, sans-serif; }
    a { color: #E86A4B; } a:hover { color: #F08B70; }
    .m  { font-family: Newsreader, Georgia, serif; font-style: italic; font-weight: 400; }
    .mu { font-style: normal; }
    .lim { display: inline-flex; flex-direction: column; align-items: center; vertical-align: -0.42em; line-height: 1.02; font-style: normal; }
    .lim > span:last-child { font-size: 0.54em; }
  </style>
</helmet>

<div style="width: 1920px; height: 1080px; background: #14120F; color: #F2EFE9; box-sizing: border-box; padding: 60px 0 0; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- top rail -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 96px 0 96px;">
    <div style="display: flex; align-items: center; gap: 16px; font-size: 15px; letter-spacing: 0.22em; color: #6E6961;">
      <span>§&thinsp;3.1</span>
      <span style="width: 44px; height: 1px; background: #2A2621;"></span>
      <span>CONTINUITY</span>
    </div>
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="width: 26px; height: 3px; background: #E86A4B;"></span>
      <span style="width: 26px; height: 3px; background: #2A2621;"></span>
      <span style="font-size: 15px; letter-spacing: 0.22em; color: #6E6961; margin-left: 8px;">STEP 1 / 2</span>
    </div>
  </div>

  <!-- semantic identity lives in a fixed margin slot, not in a colour -->
  <div style="display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 0; flex-grow: 1; padding: 46px 96px 0;">

    <div style="display: flex; flex-direction: column; gap: 0; padding-top: 10px;">
      <div style="font-size: 26px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.06; color: #3A342C;">PRO<br>POSI<br>TION</div>
      <div style="font-size: 58px; font-weight: 800; color: #F2EFE9; letter-spacing: -0.03em; margin-top: 16px; font-variant-numeric: tabular-nums;">3.1</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 0; min-width: 0;">
      <div style="font-family: Newsreader, Georgia, serif; font-weight: 300; font-size: 78px; line-height: 1.0; letter-spacing: -0.015em; max-width: 1180px;">Sine and cosine<br>are continuous</div>

      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 500px; gap: 60px; margin-top: 44px; align-items: start;">

        <div style="display: flex; flex-direction: column; gap: 0;">
          <div style="font-size: 14px; letter-spacing: 0.22em; color: #6E6961; padding-bottom: 18px; border-bottom: 1px solid #2A2621;">PROOF</div>

          <div style="display: flex; gap: 26px; align-items: baseline; padding: 26px 0 0;">
            <span style="font-size: 15px; color: #4A443C; font-variant-numeric: tabular-nums; letter-spacing: 0.1em; flex-shrink: 0;">01</span>
            <div style="font-family: Newsreader, Georgia, serif; font-size: 44px; color: #F2EFE9; font-weight: 300;">
              0 &nbsp;&le;&nbsp; |<span class="mu">sin</span>&thinsp;<span class="m">θ</span>| &nbsp;&le;&nbsp; |<span class="m">θ</span>|
            </div>
          </div>
          <div style="padding-left: 41px; font-size: 19px; color: #6E6961; letter-spacing: 0.01em;">chord never exceeds arc</div>

          <div style="display: flex; gap: 26px; align-items: baseline; padding: 30px 0 0;">
            <span style="font-size: 15px; color: #4A443C; font-variant-numeric: tabular-nums; letter-spacing: 0.1em; flex-shrink: 0;">02</span>
            <div style="font-family: Newsreader, Georgia, serif; font-size: 44px; color: #F2EFE9; font-weight: 300;">
              |<span class="m">θ</span>| &rarr; 0
              <span style="color: #E86A4B; padding: 0 14px;">&rArr;</span>
              <span class="mu">sin</span>&thinsp;<span class="m">θ</span> &rarr; 0
            </div>
          </div>
          <div style="padding-left: 41px; font-size: 19px; color: #6E6961; letter-spacing: 0.01em;">the squeeze does the rest</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px;">
          <div style="font-size: 14px; letter-spacing: 0.22em; color: #6E6961; padding-bottom: 18px; border-bottom: 1px solid #2A2621;">WHERE THE BOUND COMES FROM</div>
          <svg viewBox="0 0 500 300" style="width: 100%; height: auto; margin-top: 6px;">
            <circle cx="110" cy="232" r="186" fill="none" stroke="#241F1A" stroke-width="1.6"/>
            <path d="M110 232 L296 232" stroke="#3A342C" stroke-width="1.5"/>
            <path d="M110 232 L252.5 112.4" stroke="#3A342C" stroke-width="1.5"/>
            <path d="M296 232 A186 186 0 0 0 252.5 112.4" fill="none" stroke="#E86A4B" stroke-width="5" stroke-linecap="round"/>
            <path d="M252.5 112.4 L252.5 232" fill="none" stroke="#F2EFE9" stroke-width="5" stroke-linecap="round"/>
            <text x="146" y="224" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="20" fill="#A8A29A">θ</text>
            <circle cx="252.5" cy="112.4" r="4.5" fill="#F2EFE9"/>
            <text x="266" y="104" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="20" fill="#A8A29A">B</text>
            <text x="268" y="184" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="21" fill="#F2EFE9">sin θ</text>
            <text x="330" y="152" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="21" fill="#E86A4B">θ</text>

            <rect x="392" y="96" width="70" height="13" rx="6.5" fill="#F2EFE9"/>
            <rect x="392" y="146" width="76" height="13" rx="6.5" fill="#E86A4B"/>
            <text x="392" y="86" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="18" fill="#A8A29A">sin θ</text>
            <text x="392" y="136" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="18" fill="#E86A4B">θ</text>
          </svg>
        </div>

      </div>
    </div>
  </div>

  <!-- conclusion: full-bleed band, the heaviest thing on the frame -->
  <div style="background: #5CC79C; color: #0E1512; padding: 34px 96px 38px; display: flex; align-items: baseline; justify-content: space-between; margin-top: 40px;">
    <div style="font-family: Newsreader, Georgia, serif; font-size: 72px; font-weight: 400; letter-spacing: -0.005em;">
      <span class="lim"><span class="mu">lim</span><span class="m">θ&rarr;0</span></span>&thinsp;<span class="mu">sin</span>&thinsp;<span class="m">θ</span> = 0
    </div>
    <div style="font-size: 15px; font-weight: 700; letter-spacing: 0.22em;">THE SEED</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
