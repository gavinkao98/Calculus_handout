why_composition_is_missing: |
  We can differentiate sine and cosine now -- but only in their bare form.
  {show math.0} We can handle sine x, yet nothing so far reaches
  sine of x squared or the square root of the quantity one plus x squared,
  where one function is fed into another.
  {show math.1} We built rules for sums, products, and quotients -- but
  never for composition, the operation of dropping one function inside
  another.
  {show statement} That is the one gap left, and the chain rule fills it
  exactly -- and with it, the toolkit for differentiation is finally
  complete.

rates_multiply_intuition: |
  Here's the whole idea in one picture. Near a point, a differentiable
  function behaves like its tangent line -- it scales a small change in its
  input by its slope, with an error that shrinks faster than the change
  does.
  {show math.0} Now chain two together: g scales a small increment h by
  g prime of x, and then f scales that by f prime at g of x.
  {show statement} The two magnifications stack -- so the composite scales
  h by the product f prime at g of x, times g prime of x.
  {show math.1} That's the chain rule; the proof, later, is just checking
  the two small errors stay negligible once chained.

chain_rule_statement: |
  Let's state it precisely.
  {show statement} If g is differentiable at x sub zero, and f is
  differentiable at g of x sub zero, then the composition P of x equals
  f of g of x is differentiable at x sub zero too.
  {show math.0} And its derivative is the outer derivative at the inner
  function, times the inner derivative.
  {show math.1} Read it from the inside out. We'll earn this with a proof a
  little later -- for now, let's learn to use it.

composed_mapping_figure: |
  Picture the rule as a relay of two stretches.
  {show inc_h} Start with a small increment h sitting at x sub zero.
  {show stretch_g} The first function g carries it forward and stretches
  it to about g prime of x sub zero, times h, now sitting at u sub zero
  equals g of x sub zero.
  {show stretch_f} The second function f stretches that again by its own
  slope there, landing at about f prime at g of x sub zero, times g prime
  of x sub zero, times h.
  {show product} Two stretches one after the other -- and stretching by one
  factor then another just multiplies the factors. That's why the
  composite's slope is the product of the two local slopes.

leibniz_form: |
  There's a second way to write the rule, and it's the one you'll actually
  compute with.
  {show math.0} Name the inner variable u equals g of x and the output
  y equals f of u.
  Then the chain rule takes its memorable shape: the rate of y per x
  equals the rate of y per u times the rate of u per x.
  {show statement} It looks as though the d u's simply cancel -- a handy way
  to remember it, but not a proof.
  {show math.1} These aren't fractions with a common factor to strike out;
  each is a limit. What truly makes the rule work is the error argument
  we're about to give.

decomposition_strategy: |
  Here's a reliable way to take any composition apart -- work from the
  outside in.
  {show math.0} First, spot the outermost operation -- the last thing you'd
  do if you plugged in a number. That's the outer function f.
  {show math.1} Whatever it's applied to is the inner function u equals g of x.
  {show math.2} Differentiate the outside at the inside, keeping the inside
  whole.
  {show math.3} Then multiply by the inner derivative.

decomposition_strategy_repeat: |
  {show statement} And if the inside is
  itself a composition, just run the steps again.
  {show math.0} So the square root of the quantity one plus x squared has
  outer root and inner one plus x squared;
  {show math.1} sine of x squared has outer sine and inner x squared.

proof_strategy_bridge: |
  The rule is already usable -- now let's earn it.
  {show statement} To prove the two slopes really multiply, we handle both
  functions' tangent-line approximations at once -- and for that we repackage
  what differentiable means.
  {show scaffold.flag.borrowed_ch2} Two facts we'll lean on without re-proving: the
  product rule, and that a differentiable function is continuous.
  {show math.0} We earlier called f differentiable at x sub zero when its
  difference quotient has a limit -- and that limit is f prime of x sub zero.
  {show math.1} We're about to say exactly the same thing, only phrased as
  approximation by a straight line.

remainder_form_definition: |
  Here's the form.
  {show statement} We say f is differentiable at x sub zero if there's a number
  m and a function R with this equation, where the remainder over h
  goes to zero.
  {show math.0} The number m is just the derivative, f prime of x sub zero.
  {show math.1} Informally: f of the quantity x sub zero plus h equals its
  tangent-line value plus an error that dies faster than h itself. That
  "faster than h" is the whole point -- it's what lets these pieces compose.

remainder_tangent_figure: |
  Let's watch that error shrink. Here's the graph of f near x sub zero, hugging
  its tangent line.
  {show gap_Rh} At a nearby point x sub zero plus h the two don't quite agree,
  and the little vertical gap between them is exactly the remainder R of h.
  {show gap_halved} Now halve h. The gap doesn't merely halve -- it
  collapses far faster, shrinking to nothing next to h. That's the picture
  of the remainder over h going to zero.
  {show local_fact} And this single-curve fact is what's underneath the
  composition: up close, each function is almost its own tangent line, and
  it's those straight-line parts whose slopes multiply.

two_forms_equivalent: |
  Before we use this, let's check it's not a new idea -- just the old one
  rewritten.
  {show statement} The claim: the limit form and the remainder form are
  equivalent, with the same m.
  {show proof.0} One direction -- if the difference quotient tends to m,
  set R of h equals f of the quantity x sub zero plus h, minus f of x sub
  zero, minus m h;
  {show proof.1} then the ratio of R of h to h is that quotient minus m,
  which goes to zero.
  {show proof.2} The other way runs backward: divide the remainder equation
  by h and the quotient becomes m plus the ratio of R of h to h, which goes
  to m.
  {show qed} Same property, same derivative -- two ways of saying one thing.

proof_setup_substitution: |
  Now the proof, and the remainder form does the heavy lifting.
  {show proof.0} Because g is differentiable at x sub zero, write it in
  remainder form, with m sub one equals g prime of x sub zero.
  {show proof.1} Because f is differentiable at g of x sub zero, apply its
  remainder form too -- with m sub one times h, plus R sub one of h,
  playing the role of h.
  {show proof.2} Collect the part linear in h, and sweep everything else
  into a single remainder R sub three.
  {show qed} Matched against the remainder form, that already gives the
  derivative we want -- provided the ratio of R sub three of h to h goes to
  zero. That one limit is
  all that's left.

proof_easy_piece: |
  {show proof.0} Split that quotient into two pieces.
  {show proof.1} The first is easy: m sub two is a constant and the ratio of
  R sub one of h to h goes
  to zero, so the whole first piece goes to zero.
  {show proof.2} And note for later -- the inner increment m sub one times h,
  plus R sub one of h,
  itself goes to zero, since both m sub one times h and R sub one of h do.
  {show qed} So the easy piece is settled; everything delicate now lives in
  the second piece.

proof_delicate_choices: |
  The second piece is the careful one -- a remainder of f at that wobbling
  inner increment, over h. Run an epsilon-delta argument; fix any
  epsilon greater than zero.
  {show proof.0} Since the ratio of R sub two of y to y goes to zero, there's
  a delta so the relative
  remainder of f is below epsilon for zero less than the absolute value of y,
  less than delta.
  {show proof.1} Since the inner increment goes to zero, there's an alpha
  keeping it below delta for zero less than the absolute value of h, less
  than alpha.
  {show proof.2} Take such an h. If the inner increment is exactly zero,
  then R sub two of zero equals zero and the piece is just zero.
  {show qed} So only the nonzero case is left.

proof_delicate_bound: |
  Take the nonzero case.
  {show proof.0} Multiply and divide by the inner increment, splitting the
  piece into two factors.
  {show proof.1} The second factor is below epsilon by our choice of
  delta, the first is bounded by the triangle inequality, and shrinking
  the window once more so the ratio of the absolute value of R sub one of h
  to the absolute value of h is less than one puts the whole piece below
  the quantity, the absolute value of m sub one, plus one, times epsilon.
  {show qed} A fixed constant times epsilon, and epsilon was
  arbitrary -- so this piece vanishes too. Both pieces vanish, the ratio of
  R sub three of h to h
  goes to zero, and the chain rule is proved.

example_single_composition: |
  Time to use it -- two quick ones.
  {show step.0} For the square root of the quantity one plus x squared, the
  outer is the square root and the
  inner is one plus x squared: the outer derivative times two x tidies to x over
  the square root of the quantity one plus x squared.
  {show step.1} For sine of x squared, the outer is sine and the inner is
  x squared:
  cosine of the inside times two x.
  {show result} Notice that two x in each -- it's the inner derivative, and
  forgetting it is the single most common slip.

caution_inner_derivative: |
  Let's make that mistake explicit, so you never make it.
  {show body} The most common chain-rule error is to differentiate the outer
  function and then stop -- to write the derivative of sine of g of x as just
  cosine of g of x. That's wrong; the right answer carries the inner factor
  g prime of x. The two x back in sine of x squared is never optional.

example_nested_three_layers: |
  Now let the inside be a composition too -- the square root of the quantity
  one plus sine squared x is three
  layers deep, since sine squared x is itself sine x, all squared.
  {show step.0} The square root gives one over twice itself, times the
  derivative of the inside.
  {show step.1} That inside derivative is the square of sine x, which by the
  chain rule again is two sine x cosine x.
  {show result} Three layers, three factors -- and they simply multiply down
  the chain.

example_chain_times_quotient: |
  Sometimes the inner derivative is a small problem of its own.
  {show step.0} The outer is the square root, the inner is the fraction -- so
  the chain rule gives one over twice the root, times the derivative of the
  fraction.
  {show step.1} And that derivative is a quotient rule: it comes out to three
  over the quantity x plus two, squared.
  {show step.2} Tidy the front factor and multiply --
  {show result} the answer is three
  over twice the product. The chain rule started the job; the quotient rule
  finished the inside.

example_chain_times_product: |
  Same story, a different partner rule.
  {show step.0} The outermost operation is a product, so start with the
  product rule.
  {show step.1} The leftover derivative needs the chain rule, since
  cosine squared x is cosine x, all squared -- giving minus two sine x cosine x.
  {show result} Put it together. The product rule split the work; the chain
  rule supplied the slope inside the second piece.

example_leibniz_rates: |
  Here's the Leibniz form earning its keep. Kelp K depends on the urchins
  U that eat it, and U on the otters O that eat them.
  {show step.0} Read each link: more urchins, less kelp, so d K over d U is
  negative; more otters, fewer urchins, so d U over d O is negative.
  {show step.1} The chain rule chains the two rates.
  {show result} A product of two negatives is positive -- so d K over d O is
  positive: more otters ultimately means more kelp. The signs multiply along
  the chain.

toward_section_3_3: |
  {show statement} With the chain rule in hand, any function you build by
  composing the elementary ones can now be differentiated, almost
  mechanically.
  {show math.0} But the rule does something more interesting next -- it
  becomes a key, unlocking derivatives we couldn't otherwise reach: the
  inverse functions, and even something like x to the x through a clever trick.
  That's where we head next.

recap: |
  Pull the section together.
  {show point.0} The chain rule differentiates a composition: the outer
  derivative at the inner function, times the inner derivative.
  {show point.1} In Leibniz form, the rates multiply.
  {show point.2} To use it, decompose from the outside in -- every layer
  contributes one slope factor.
  {show point.3} The number-one pitfall is dropping the inner derivative; and
  underneath it all, each function is locally its tangent line, so the local
  slopes multiply.
