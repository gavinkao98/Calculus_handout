- id: caution_inner_derivative
  kind: content
  template: callout
  type: caution
  accent: caution
  ref: md:caution_inner_derivative
  source: chapter3-print-standalone.html SS3.2 . Caution (forgetting the inner derivative)
  title: Never Drop the Inner Derivative
  say: 'Let''s make that mistake explicit, so you never make it.

    {show body} The most common chain-rule error is to differentiate the outer

    function and then stop -- to write the derivative of sine of g of x as just

    cosine of g of x. That''s wrong; the right answer carries the inner factor

    g prime of x. The two x back in sine of x squared is never optional.

    '
  body: 'Wrong: $\tfrac{d}{dx}\sin(g(x))=\cos(g(x))$. Right: $\tfrac{d}{dx}\sin(g(x))=\cos(g(x))\cdot g''(x)$. The inner factor $g''(x)$ --- the $2x$ in $\sin(x^{2})$ --- is never optional.'
