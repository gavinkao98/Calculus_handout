  - easy_zero
  - inner_to_zero
  scaffold:
    motive: Split $R_3/h$ in two — dispatch the easy piece first.
  source: chapter3-print-standalone.html SS3.2 . Proof of Theorem 3.3 (split R_3/h; easy piece; inner -> 0)
  title: Why the Slopes Multiply
  say: '{show proof.0} Split that quotient into two pieces.

    {show proof.1} The first is easy: m sub two is a constant and the ratio of

    R sub one of h to h goes

    to zero, so the whole first piece goes to zero.

    {show proof.2} And note for later -- the inner increment m sub one times h,

    plus R sub one of h,

    itself goes to zero, since both m sub one times h and R sub one of h do.

    {show qed} So the easy piece is settled; everything delicate now lives in

    the second piece.

    '
  statement: Split the quotient; the easy piece is settled.
  proof:
  - $\tfrac{R_3(h)}{h}=m_2\,\tfrac{R_1(h)}{h}+\tfrac{R_2(m_1 h+R_1(h))}{h}$
  - $m_2\,\tfrac{R_1(h)}{h}\to 0\quad(m_2\text{ const},\ \tfrac{R_1(h)}{h}\to 0)$
  - $m_1 h+R_1(h)\to 0\quad(\text{noted for later})$
  qed: the delicate piece remains
- id: proof_delicate_choices
  kind: content
  template: theorem_proof
  accent: theorem
  label: '[ proof of the chain rule ]'
  part:
    current: 3
    total: 4
  ref: md:proof_delicate_choices
  covers:
  - choose_delta
  - choose_alpha
  - zero_case
  scaffold:
    motive: 'The delicate piece: an $\varepsilon$–$\delta$ argument, choose the windows.'
  source: chapter3-print-standalone.html SS3.2 . Proof of Theorem 3.3 (choose delta, alpha; zero case)
  title: Why the Slopes Multiply
  say: 'The second piece is the careful one -- a remainder of f at that wobbling

    inner increment, over h. Run an epsilon-delta argument; fix any

    epsilon greater than zero.

    {show proof.0} Since the ratio of R sub two of y to y goes to zero, there''s

    a delta so the relative

    remainder of f is below epsilon for zero less than the absolute value of y,

    less than delta.

    {show proof.1} Since the inner increment goes to zero, there''s an alpha

    keeping it below delta for zero less than the absolute value of h, less

    than alpha.

    {show proof.2} Take such an h. If the inner increment is exactly zero,

    then R sub two of zero equals zero and the piece is just zero.

    {show qed} So only the nonzero case is left.

    '
  statement: Fix $\varepsilon>0$ and choose the windows.
  proof:
  - $\tfrac{R_2(y)}{y}\to 0\ \Rightarrow\ \exists\,\delta:\ \bigl|\tfrac{R_2(y)}{y}\bigr|<\varepsilon\ \ (0<|y|<\delta)$
  - $m_1 h+R_1(h)\to 0\ \Rightarrow\ \exists\,\alpha:\ |m_1 h+R_1(h)|<\delta\ \ (0<|h|<\alpha)$
  - $m_1 h+R_1(h)=0\ \Rightarrow\ R_2(0)=0\ \Rightarrow\ \text{piece}=0$
  qed: only the nonzero case remains
- id: proof_delicate_bound
  kind: content
  template: theorem_proof
  accent: theorem
  label: '[ proof of the chain rule ]'
  part:
    current: 4
    total: 4
  ref: md:proof_delicate_bound
  covers:
  - factor_split
  - triangle_bound
  scaffold:
    motive: Bound the delicate piece; $\varepsilon$ is arbitrary, so it vanishes.
  source: chapter3-print-standalone.html SS3.2 . Proof of Theorem 3.3 (factor, triangle bound, alpha_1; QED)
  title: Why the Slopes Multiply
  say: 'Take the nonzero case.

    {show proof.0} Multiply and divide by the inner increment, splitting the

    piece into two factors.

    {show proof.1} The second factor is below epsilon by our choice of

    delta, the first is bounded by the triangle inequality, and shrinking

    the window once more so the absolute value of the ratio of R sub one of h

    to h is less than one puts the whole piece below the quantity, the absolute

    value of m sub one, plus one, times epsilon.

    {show qed} A fixed constant times epsilon, and epsilon was

    arbitrary -- so this piece vanishes too. Both pieces vanish, the ratio of

    R sub three of h to h

    goes to zero, and the chain rule is proved.

    '
  statement: Bound the nonzero case; $\varepsilon$ was arbitrary, so it vanishes.
  proof:
  - $\tfrac{|R_2(m_1 h+R_1(h))|}{|h|}=\tfrac{|m_1 h+R_1(h)|}{|h|}\cdot\tfrac{|R_2(m_1 h+R_1(h))|}{|m_1 h+R_1(h)|}$
  - $\bigl|m_1+R_1(h)/h\bigr|\le|m_1|+|R_1(h)|/|h|\ \Rightarrow\ \text{piece}<(|m_1|+1)\,\varepsilon$
  qed: so $\tfrac{R_3(h)}{h}\to 0$ --- proved
