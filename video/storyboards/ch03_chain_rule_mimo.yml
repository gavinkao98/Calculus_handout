- id: remainder_form_definition
  kind: content
  template: definition_math
  accent: definition
  ref: md:remainder_form_definition
  source: chapter3-print-standalone.html SS3.2 . Definition 3.1 (remainder form) + informal gloss
  title: Differentiability, Remainder Form
  say: 'Here''s the form.

    {show statement} We say f is differentiable at x sub zero if there''s a number

    m and a function R with this equation, where the remainder over h

    goes to zero.

    {show math.0} The number m is just the derivative, f prime of x sub zero.

    {show math.1} Informally: f of the quantity x sub zero plus h equals its

    tangent-line value plus an error that dies faster than h itself. That

    "faster than h" is the whole point -- it''s what lets these pieces compose.

    '
  statement: $f(x_0+h)=f(x_0)+m\,h+R(h),\qquad \displaystyle\lim_{h\to 0}\frac{R(h)}{h}=0.$
  math:
  - $m=f'(x_0)$
  - tex: $f(x_0+h)\approx \underbrace{f(x_0)+m\,h}_{\text{tangent line}}\ +\ \underbrace{R(h)}_{\text{error}\,\ll\, h}$
    anim: highlight
