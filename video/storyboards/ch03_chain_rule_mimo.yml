  say: 'Now let the inside be a composition too -- the square root of the quantity

    one plus sine squared x is three

    layers deep, since sine squared x is itself sine x, all squared.

    {show step.0} The square root gives one over twice itself, times the

    derivative of the inside.

    {show step.1} That inside derivative is the square of sine x, which by the

    chain rule again is two sine x cosine x.

    {show result} Three layers, three factors -- and they simply multiply down

    the chain.

    '
  steps:
  - math: \frac{d}{dx}\sqrt{1+\sin^{2}x} = \frac{1}{2\sqrt{1+\sin^{2}x}}\cdot\frac{d}{dx}\!\left(1+\sin^{2}x\right)
    reason: 'outer: square root'
  - math: = \frac{1}{2\sqrt{1+\sin^{2}x}}\cdot 2\sin x\cos x
    reason: chain rule again
  result:
    math: \frac{d}{dx}\sqrt{1+\sin^{2}x} = \frac{\sin x\cos x}{\sqrt{1+\sin^{2}x}}
    reason: the factors multiply
- id: example_chain_times_quotient
  kind: content
  template: derivation
  accent: example
  ref: md:example_chain_times_quotient
  covers:
  - outer_root
  - quotient_inner
  - tidy_front
  - answer
  scaffold:
    motive: When the inner derivative is its own problem — chain meets quotient.
  source: chapter3-print-standalone.html SS3.2 . Example 3.6 (sqrt((x-1)/(x+2)), x>1)
  title: When the Inside Is Its Own Problem
  prompt: Differentiate $\sqrt{\tfrac{x-1}{x+2}}$ for $x>1$.
  say: 'Sometimes the inner derivative is a small problem of its own.

    {show step.0} The outer is the square root, the inner is the fraction -- so

    the chain rule gives one over twice the root, times the derivative of the

    fraction.

    {show step.1} And that derivative is a quotient rule: it comes out to three

    over the square of the quantity x plus two.

    {show step.2} Tidy the front factor and multiply --

    {show result} the answer is three

    over twice the product. The chain rule started the job; the quotient rule

    finished the inside.

    '
  steps:
  - math: \frac{d}{dx}\sqrt{\frac{x-1}{x+2}} = \frac{1}{2\sqrt{(x-1)/(x+2)}}\cdot\frac{d}{dx}\!\left(\frac{x-1}{x+2}\right)
    reason: 'outer: square root'
  - math: \tfrac{d}{dx}\!\left(\tfrac{x-1}{x+2}\right) = \tfrac{(x+2)\cdot 1-(x-1)\cdot 1}{(x+2)^{2}} = \tfrac{3}{(x+2)^{2}}
    reason: quotient rule
  - math: \tfrac{1}{2\sqrt{(x-1)/(x+2)}} = \tfrac{\sqrt{x+2}}{2\sqrt{x-1}}
    reason: tidy the front factor
  result:
    math: \frac{\sqrt{x+2}}{2\sqrt{x-1}}\cdot\frac{3}{(x+2)^{2}} = \frac{3}{2\sqrt{x-1}\,(x+2)^{3/2}}\quad(x>1)
- id: example_chain_times_product
  kind: content
  template: derivation
  accent: example
  ref: md:example_chain_times_product
  covers:
  - product_rule
  - chain_on_cos2
  - answer
  scaffold:
    motive: The chain rule teams up with the product rule.
  source: chapter3-print-standalone.html SS3.2 . Example 3.7 ((1+x^2) cos^2 x)
  title: Two Rules Cooperate
  prompt: Differentiate $y=(1+x^{2})\cos^{2}x$.
  say: 'Same story, a different partner rule.

    {show step.0} The outermost operation is a product, so start with the

    product rule.

    {show step.1} The leftover derivative needs the chain rule, since

    cosine squared x is cosine x, all squared -- giving minus two sine x cosine x.

    {show result} Put it together. The product rule split the work; the chain

    rule supplied the slope inside the second piece.

    '
  steps:
  - math: y' = (2x)\cos^{2}x + (1+x^{2})\,\frac{d}{dx}\!\left(\cos^{2}x\right)
    reason: product rule
  - math: \frac{d}{dx}\!\left(\cos^{2}x\right) = 2\cos x\,(-\sin x) = -2\sin x\cos x
    reason: chain rule on $(\cos x)^{2}$
  result:
    math: y' = 2x\cos^{2}x - 2(1+x^{2})\sin x\cos x
    reason: both rules together
- id: example_leibniz_rates
  kind: content
  template: derivation
  accent: example
  ref: md:example_leibniz_rates
  covers:
  - link_signs
  - leibniz_chain
  - answer
  scaffold:
    motive: Leibniz form earning its keep — signs along a chain.
  source: chapter3-print-standalone.html SS3.2 . Example 3.8 (kelp/urchin/otter, Leibniz)
  title: Signs Along a Chain
  prompt: Kelp $K$ depends on urchins $U$, and $U$ on otters $O$. Is $\tfrac{dK}{dO}$ positive or negative?
  say: 'Here''s the Leibniz form earning its keep. Kelp K depends on the urchins

    U that eat it, and U on the otters O that eat them.

    {show step.0} Read each link: more urchins, less kelp, so d K over d U is

    negative; more otters, fewer urchins, so d U over d O is negative.

    {show step.1} The chain rule chains the two rates.

    {show result} A product of two negatives is positive -- so d K over d O is

    positive: more otters ultimately means more kelp. The signs multiply along

    the chain.

    '
  steps:
  - math: \frac{dK}{dU} < 0, \qquad \frac{dU}{dO} < 0
    reason: read each link
  - math: \frac{dK}{dO} = \frac{dK}{dU}\cdot\frac{dU}{dO}
    reason: Leibniz form
  result:
    math: \frac{dK}{dO} = (-)\cdot(-) > 0
    reason: more otters, more kelp
