- id: two_forms_equivalent
  kind: content
  template: theorem_proof
  accent: proposition
  label: '[ proposition ]'
  ref: md:two_forms_equivalent
  covers:
  - define_R
  - forward
  - backward
  scaffold:
    motive: Check the remainder form is the old derivative, just rewritten.
  source: chapter3-print-standalone.html SS3.2 . Proposition 3.3 + Proof (both directions)
  title: The Two Forms Agree
  say: 'Before we use this, let''s check it''s not a new idea -- just the old one

    rewritten.

    {show statement} The claim: the limit form and the remainder form are

    equivalent, with the same m.

    {show proof.0} One direction -- if the difference quotient tends to m,

    set R of h equals f of the quantity x sub zero plus h, minus f of x sub

    zero, minus m h;

    {show proof.1} then the ratio of R of h to h is that quotient minus m,

    which goes to zero.

    {show proof.2} The other way runs backward: divide the remainder equation

    by h and the quotient becomes m plus the ratio of R of h to h, which goes

    to m.

    {show qed} Same property, same derivative -- two ways of saying one thing.

    '
  statement: Limit form $\Longleftrightarrow$ remainder form, same $m=f'(x_0)$ in both forms.
  proof:
  - $R(h):=f(x_0+h)-f(x_0)-m\,h$
  - $\tfrac{R(h)}{h}=\tfrac{f(x_0+h)-f(x_0)}{h}-m\ \longrightarrow\ 0$
  - $\tfrac{f(x_0+h)-f(x_0)}{h}=m+\tfrac{R(h)}{h}\ \longrightarrow\ m$
  qed: same property, same derivative
- id: proof_setup_substitution
  kind: content
  template: theorem_proof
  accent: theorem
  label: '[ proof of the chain rule ]'
  part:
    current: 1
    total: 4
  ref: md:proof_setup_substitution
  covers:
  - g_remainder
  - f_remainder
  - collect_R3
  scaffold:
    motive: Let the remainder form do the lifting — substitute both, collect.
  source: chapter3-print-standalone.html SS3.2 . Proof of Theorem 3.3 (substitution, collect, R_3)
  title: Why the Slopes Multiply
  say: 'Now the proof, and the remainder form does the heavy lifting.

    {show proof.0} Because g is differentiable at x sub zero, write it in

    remainder form, with m sub one equals g prime of x sub zero.

    {show proof.1} Because f is differentiable at g of x sub zero, apply its

    remainder form too -- with m sub one times h, plus R sub one of h,

    playing the role of h.

    {show proof.2} Collect the part linear in h, and sweep everything else

    into a single remainder R sub three.

    {show qed} Matched against the remainder form, that already gives the

    derivative we want -- provided the ratio of R sub three of h to h goes to

    zero. That one limit is

    all that''s left.

    '
  statement: Substitute the remainder forms.
  proof:
  - $g(x_0+h)=g(x_0)+m_1 h+R_1(h),\quad m_1=g'(x_0)$
  - $P(x_0+h)=f(g(x_0))+m_2\!\left[m_1 h+R_1(h)\right]+R_2\!\left(m_1 h+R_1(h)\right),\quad m_2=f'(g(x_0))$
  - $=P(x_0)+\bigl(g'(x_0)f'(g(x_0))\bigr)h+R_3(h),\quad R_3(h)=m_2R_1(h)+R_2\bigl(m_1 h+R_1(h)\bigr)$
  qed: 'remains: $\tfrac{R_3(h)}{h}\to 0$'
- id: proof_easy_piece
  kind: content
  template: theorem_proof
  accent: theorem
  label: '[ proof of the chain rule ]'
  part:
