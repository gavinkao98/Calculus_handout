<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap');
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: #4FA6DE; } a:hover { color: #7CC0EA; }
    .m  { font-family: 'Source Serif 4', Georgia, serif; font-style: italic; }
    .mu { font-style: normal; }
    .lim { display: inline-flex; flex-direction: column; align-items: center; vertical-align: -0.42em; line-height: 1.04; font-style: normal; }
    .lim > span:last-child { font-size: 0.56em; }
  </style>
</helmet>

<div style="width: 1920px; height: 1080px; background: #0F1720; color: #ECF1F7; box-sizing: border-box; padding: 74px 96px; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: flex-start; justify-content: space-between; padding-bottom: 26px; border-bottom: 1px solid #22303F;">
    <div style="display: flex; flex-direction: column; gap: 13px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span style="background: #4FA6DE; color: #0F1720; font-size: 19px; font-weight: 700; letter-spacing: 0.09em; padding: 6px 15px; border-radius: 4px;">PROPOSITION</span>
        <span style="color: #4FA6DE; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;">3.1</span>
      </div>
      <div style="font-size: 60px; font-weight: 700; letter-spacing: -0.018em; line-height: 1.05;">Sine and Cosine Are Continuous</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 7px; padding-top: 6px;">
      <span style="font-size: 20px; color: #717C8A; font-variant-numeric: tabular-nums; letter-spacing: 0.03em;">STEP 1 OF 2</span>
      <span style="font-size: 17px; color: #4A5765;">§3.1</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr); gap: 66px; padding-top: 34px;">

    <div style="display: flex; flex-direction: column; gap: 24px;">
      <div style="border-left: 3px solid #4FA6DE; padding-left: 24px; display: flex; flex-direction: column; gap: 12px;">
        <span style="align-self: flex-start; border: 1.5px solid #4FA6DE; color: #4FA6DE; font-size: 15px; font-weight: 700; letter-spacing: 0.11em; padding: 4px 12px; border-radius: 4px;">PROOF</span>
        <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 27px; color: #AFB9C6; line-height: 1.5;">
          Everything rests on one bound near <span class="m">θ</span> = 0.
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 26px; padding-left: 27px;">
        <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 42px; color: #ECF1F7;">
          0 &nbsp;&le;&nbsp; |<span class="mu">sin</span>&thinsp;<span class="m">θ</span>| &nbsp;&le;&nbsp; |<span class="m">θ</span>|
          <span style="font-family: 'Instrument Sans', sans-serif; font-size: 21px; color: #717C8A; margin-left: 22px;">chord &le; arc</span>
        </div>

        <div style="display: flex; align-items: center; gap: 20px; font-family: 'Source Serif 4', Georgia, serif; font-size: 42px; color: #ECF1F7;">
          <span>|<span class="m">θ</span>| &rarr; 0</span>
          <svg width="46" height="20" viewBox="0 0 46 20" fill="none" style="flex-shrink: 0;">
            <path d="M1 10 H40 M33 4 L41 10 L33 16" stroke="#4FA6DE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span style="font-family: 'Instrument Sans', sans-serif; font-size: 21px; color: #717C8A;">squeeze</span>
        </div>
      </div>

      <div style="margin-top: auto; background: linear-gradient(180deg, rgba(62,190,124,0.10), rgba(62,190,124,0.03)); border: 1px solid rgba(62,190,124,0.34); border-radius: 6px; padding: 30px 36px 34px; display: flex; align-items: baseline; justify-content: space-between;">
        <div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 62px; color: #3EBE7C; text-shadow: 0 0 34px rgba(62,190,124,0.30);">
          <span class="lim"><span class="mu">lim</span><span class="m">θ&rarr;0</span></span>&thinsp;<span class="mu">sin</span>&thinsp;<span class="m">θ</span> = 0
        </div>
        <div style="font-size: 15px; font-weight: 600; letter-spacing: 0.11em; color: #3EBE7C;">THE SEED</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px;">
      <div style="font-size: 16px; font-weight: 600; letter-spacing: 0.11em; color: #717C8A;">WHERE THE BOUND COMES FROM</div>
      <div style="flex-grow: 1; background: #16202C; border: 1px solid #22303F; border-radius: 6px; padding: 26px 30px;">
        <svg viewBox="0 0 560 330" style="width: 100%; height: auto;">
          <circle cx="120" cy="250" r="200" fill="none" stroke="#2B3948" stroke-width="1.6"/>
          <path d="M120 250 L320 250" stroke="#3B4A5B" stroke-width="1.6"/>
          <path d="M120 250 L273.2 121.4" stroke="#3B4A5B" stroke-width="1.6"/>
          <path d="M320 250 A200 200 0 0 0 273.2 121.4" fill="none" stroke="#4FA6DE" stroke-width="5" stroke-linecap="round"/>
          <path d="M273.2 121.4 L273.2 250" stroke="#D98F3C" stroke-width="5" stroke-linecap="round"/>
          <path d="M152 250 A32 32 0 0 0 144.5 229.5" fill="none" stroke="#717C8A" stroke-width="1.5"/>
          <text x="160" y="242" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="21" fill="#AFB9C6">θ</text>
          <circle cx="273.2" cy="121.4" r="5" fill="#ECF1F7"/>
          <circle cx="320" cy="250" r="5" fill="#ECF1F7"/>
          <text x="286" y="112" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="21" fill="#ECF1F7">B</text>
          <text x="330" y="272" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="21" fill="#ECF1F7">A</text>
          <text x="288" y="196" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="22" fill="#D98F3C">sin θ</text>
          <text x="352" y="168" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="22" fill="#4FA6DE">θ</text>

          <path d="M420 62 L420 292" stroke="#22303F" stroke-width="1.4"/>
          <text x="440" y="52" font-family="Instrument Sans, sans-serif" font-size="15" letter-spacing="0.08em" fill="#717C8A">STRAIGHTENED</text>
          <rect x="440" y="96" width="128.6" height="15" rx="7.5" fill="#D98F3C"/>
          <text x="440" y="84" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="19" fill="#D98F3C">sin θ</text>
          <rect x="440" y="166" width="139.6" height="15" rx="7.5" fill="#4FA6DE"/>
          <text x="440" y="154" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="19" fill="#4FA6DE">θ</text>
          <path d="M440 218 H580" stroke="#2B3948" stroke-width="1.2" stroke-dasharray="4 4"/>
          <text x="440" y="248" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="24" fill="#ECF1F7">sin θ &#8804; θ</text>
        </svg>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
